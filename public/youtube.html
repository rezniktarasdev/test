<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube — Грім та Грім</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        font-family: Manrope, system-ui, sans-serif;
        color: #fff;
        text-align: center;
        background: linear-gradient(rgba(7, 10, 19, 0.65), rgba(7, 10, 19, 0.65)),
          url('https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?auto=format&fit=crop&w=1800&q=80') center/cover no-repeat;
      }
      .topbar {
        width: min(1120px, 92vw);
        margin: 0 auto;
        padding: 1rem 0;
        display: flex;
        justify-content: flex-end;
      }
      .home-link {
        color: #d7e1f0;
        text-decoration: none;
        font-weight: 700;
      }
      .home-link:hover {
        color: #fff;
        text-decoration: underline;
      }
      main {
        display: grid;
        place-items: center;
        padding: 1rem;
      }
      h1 {
        margin: 0;
        padding: 1rem 1.25rem;
        font-size: clamp(1.6rem, 4vw, 3rem);
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="home-link" href="/">На головну</a>
    </header>
    <main>
      <h1>YouTube сторінка скоро тут буде ▶️</h1>
    </main>
  </body>
</html>
