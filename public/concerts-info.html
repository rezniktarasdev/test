<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Наші концерти</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        font-family: Manrope, system-ui, sans-serif;
        color: #ffffff;
        text-align: center;
        background:
          linear-gradient(rgba(7, 10, 19, 0.62), rgba(7, 10, 19, 0.62)),
          url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=1800&q=80')
            center / cover no-repeat;
      }
      .topbar {
        width: min(1120px, 92vw);
        margin: 0 auto;
        padding: 1rem 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        text-decoration: none;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 1px;
        font-size: 1.1rem;
      }
      .home-link {
        color: #d7e1f0;
        text-decoration: none;
        font-weight: 700;
      }
      .home-link:hover {
        color: #ffffff;
        text-decoration: underline;
      }
      main {
        display: grid;
        place-items: center;
        padding: 1rem;
      }
      h1 {
        margin: 0;
        padding: 1rem 1.25rem;
        font-size: clamp(1.6rem, 4vw, 3rem);
        font-weight: 800;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">G&amp;G</a>
      <a class="home-link" href="/">На головну</a>
    </header>

    <main>
      <h1>тут будє інфа про наші концерти</h1>
    </main>
  </body>
</html>
